<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .head-path { stroke: #2c3e50; }
    .ring-base { stroke: #2c3e50; }
    @media (prefers-color-scheme: dark) {
      .head-path { stroke: #f1f5f9; }
      .ring-base { stroke: #64748b; }
    }
  </style>
  <defs>
    <linearGradient id="favRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2c3e50" class="ring-base" />
      <stop offset="50%" stopColor="#059669" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="favWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="35%" stopColor="#10b981" />
      <stop offset="75%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <!-- Subtle drop shadow for cross-theme tab contrast -->
    <filter id="tabContrast" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#tabContrast)">
    <!-- Outer Circular Ring -->
    <circle
      cx="50"
      cy="50"
      r="44"
      stroke="url(#favRingGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Stylized Face & Ear Contour -->
    <path
      class="head-path"
      d="M 51 12 
         C 51 22, 53 28, 58 35 
         C 63 41, 65 43, 62 46 
         C 58 48, 56 49, 58 52 
         C 61 55, 60 59, 57 62 
         C 54 65, 52 69, 53 74 
         C 53 80, 48 85, 41 87"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Ear / Back Contour -->
    <path
      class="head-path"
      d="M 50 40 
         C 42 40, 31 43, 31 54 
         C 31 67, 43 69, 44 76"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- Stylized Intertwined Voice Soundwave -->
    <path
      d="M 33 53 
         C 35 44, 46 43, 49 50 
         C 52 57, 47 62, 52 63 
         C 56 64, 59 55, 64 45 
         C 68 37, 72 63, 76 63 
         C 80 63, 84 50, 89 57 
         C 92 61, 95 58, 97 55"
      stroke="url(#favWaveGrad)"
      stroke-width="4.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
