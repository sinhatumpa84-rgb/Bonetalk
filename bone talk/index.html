<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('bonetalk-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
          return;
        }
      } catch (e) { }
      // Default to LIGHT mode — SAAKANTHA's canonical appearance.
      // Never use prefers-color-scheme as default.
      document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description"
    content="SAAKANTHA — AI-powered assistive communication using EMG muscle signals, ESP32-S3, and pattern recognition." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>SAAKANTHA — The Body Has a Voice</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
