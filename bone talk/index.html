<!doctype html>

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('saakantha-theme') || localStorage.getItem('bonetalk-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
          return;
        }
      } catch (e) { }
      // Default to LIGHT mode — SAAKANTHA's canonical appearance.
      document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
